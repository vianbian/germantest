<script>
var curLv = 'A1';
var allData = null;
var seenMap = { A1: [], A2: [], B1: [], B2: [] };
var set = [
  {d:"Was machst du?", k:"너 뭐 해?", tid:"init_1"},
  {d:"Ich mache Kaffee.", k:"나 커피 만들고 있어.", tid:"init_2"},
  {d:"Das macht wirklich Spaß!", k:"그거 진짜 재미있다!", tid:"init_3"}
];
var thumbs = 0, qL = [], qi = 0, done = false, sharedSR = null, ttsTimer = null, isListening = false, tipTimer = null;
var curAud = new Audio();
window._utts = [];

try { thumbs = parseInt(localStorage.getItem('g_th') || '0', 10); document.getElementById('tCnt').innerText = thumbs; } catch(e){}
if (window.speechSynthesis) { try { speechSynthesis.getVoices(); } catch(e){} }

function hideTip(e) {
  if (e && e.target && e.target.classList && e.target.classList.contains('dw')) return;
  var tip = document.getElementById('wTip');
  if (tip) tip.style.display = 'none';
  var sels = document.querySelectorAll('.dw.sel');
  for (var i = 0; i < sels.length; i++) sels[i].classList.remove('sel');
}

function renderTipList(tip, clean, list) {
  if (!list || list.length === 0) list = ["뜻을 찾지 못했습니다"];
  var liHtml = list.slice(0, 3).map(function(txt) { return '<li>' + txt + '</li>'; }).join('');
  tip.innerHTML = '<div class="tip-title">' + clean + '</div><ol class="tip-list">' + liHtml + '</ol>';
}

function cleanWikiLine(line) {
  var ob = String.fromCharCode(91, 91);
  var cb = String.fromCharCode(93, 93);
  var txt = line.replace(/^[#*:\s']+/, '').replace(/\{\{[^}]*\}\}/g, '');
  while (txt.indexOf(ob) !== -1) {
    var s = txt.indexOf(ob);
    var e = txt.indexOf(cb, s);
    if (e === -1) break;
    var inner = txt.slice(s + 2, e);
    var pipe = inner.indexOf('|');
    var word = pipe !== -1 ? inner.slice(pipe + 1) : inner;
    txt = txt.slice(0, s) + word + txt.slice(e + 2);
  }
  return txt.replace(/'''/g, '').replace(/''/g, '').trim();
}

function parseKoWikt(wt) {
  var deIdx = wt.indexOf('독일어');
  if (deIdx === -1) return [];
  var sub = wt.slice(deIdx);
  var nextLang = sub.indexOf('\n== ');
  if (nextLang !== -1) sub = sub.slice(0, nextLang);

  var lines = sub.split('\n');
  var res = [];
  for (var i = 0; i < lines.length; i++) {
    var line = lines.at(i).trim();
    if (line.indexOf('# ') === 0) {
      var cleaned = cleanWikiLine(line);
      if (cleaned && cleaned.length > 1 && res.indexOf(cleaned) === -1) {
        res.push(cleaned);
      }
    }
    if (res.length >= 3) break;
  }
  return res;
}

function fetchKoWikt(word) {
  var url = "https://wiktionary.org" + encodeURIComponent(word) + "&prop=wikitext&format=json&origin=*";
  return fetch(url).then(function(r) { return r.json(); }).then(function(data) {
    if (data && data.parse && data.parse.wikitext) {
      var wt = Object.values(data.parse.wikitext).at(0);
      return parseKoWikt(String(wt || ''));
    }
    return [];
  });
}

function fetchDeLemma(word) {
  var url = "https://wiktionary.org" + encodeURIComponent(word) + "&prop=wikitext&format=json&origin=*";
  return fetch(url).then(function(r) { return r.json(); }).then(function(data) {
    if (data && data.parse && data.parse.wikitext) {
      var wt = String(Object.values(data.parse.wikitext).at(0) || '');
      var m = wt.match(/\{\{Grundformverweis[^|}]*\|([^|}]+)/i);
      if (m && m.at(1)) {
        return m.at(1).split('#').at(0).trim();
      }
    }
    return "";
  });
}

function lookupWord(word) {
  return fetchKoWikt(word).then(function(list) {
    if (list.length > 0) return { title: word, list: list };
    var lower = word.toLowerCase();
    if (lower !== word) {
      return fetchKoWikt(lower).then(function(list2) {
        if (list2.length > 0) return { title: lower, list: list2 };
        return null;
      });
    }
    return null;
  }).then(function(found) {
    if (found) return found;
    return fetchDeLemma(word).then(function(lemma) {
      if (!lemma && word.toLowerCase() !== word) {
        return fetchDeLemma(word.toLowerCase());
      }
      return lemma;
    }).then(function(lemma) {
      if (lemma) {
        return fetchKoWikt(lemma).then(function(list3) {
          return { title: word + " → " + lemma, list: list3 };
        });
      }
      return { title: word, list: [] };
    });
  });
}

function showWordTip(el, rawWord) {
  var clean = rawWord.replace(/^[.,!?;:"'()]+|[.,!?;:"'()]+$/g, '');
  if (!clean) return;
  hideTip();
  el.classList.add('sel');
  if (tipTimer) { clearTimeout(tipTimer); tipTimer = null; }

  var tip = document.getElementById('wTip');
  tip.innerHTML = '<div class="tip-title">' + clean + '</div><div style="color:#cbd5e1; font-size:0.8rem;">원형 및 뜻 찾는 중...</div>';
  tip.style.display = 'block';

  var rect = el.getBoundingClientRect();
  var topPos = rect.top - 78;
  if (topPos < 10) topPos = rect.bottom + 8;
  var leftPos = Math.max(12, Math.min(window.innerWidth - 242, rect.left));
  tip.style.top = topPos + 'px';
  tip.style.left = leftPos + 'px';

  lookupWord(clean).then(function(res) {
    var msg = (res.list && res.list.length > 0) ? res.list : ["사전에 미등재된 단어입니다"];
    renderTipList(tip, res.title, msg);
  }).catch(function() {
    tip.innerHTML = '<div class="tip-title">' + clean + '</div><div style="color:#fca5a5;">사전 연결 오류</div>';
  });

  tipTimer = setTimeout(function() { hideTip(); }, 3500);
}



function setLv(lv) {
  curLv = lv;
  var lvs = ['A1', 'A2', 'B1', 'B2'];
  for (var i = 0; i < lvs.length; i++) {
    document.getElementById('lv' + lvs[i]).className = (lvs[i] === lv) ? 'lvbtn on' : 'lvbtn';
  }
  getNew();
}

function stopMic() {
  isListening = false;
  if (sharedSR) {
    sharedSR.onresult = null;
    sharedSR.onerror = null;
    try { sharedSR.abort(); } catch(e){}
  }
  var qMicBtn = document.getElementById('qMic');
  if (qMicBtn) qMicBtn.innerText = '🎙️ 말하기로 풀기';
  for (var i = 0; i < 3; i++) {
    var fb = document.getElementById('fb' + i);
    if (fb && fb.innerText.indexOf('듣는 중') !== -1) fb.innerText = '';
  }
}

function stopTts() {
  if (ttsTimer) { clearTimeout(ttsTimer); ttsTimer = null; }
  if (window.speechSynthesis) { try { speechSynthesis.cancel(); } catch(e){} }
  try { curAud.pause(); curAud.onended = null; curAud.onerror = null; } catch(e){}
}

function playWebAudio(t) {
  var count = 0;
  function nextPlay() {
    if (count >= 2) return;
    curAud.src = "https://streamelements.com" + encodeURIComponent(t);
    curAud.playbackRate = (count === 1) ? 0.72 : 1.0;
    curAud.onended = function() { count++; if (count < 2) ttsTimer = setTimeout(nextPlay, 450); };
    curAud.play().catch(function(){});
  }
  nextPlay();
}

function tts(t) {
  stopMic();
  stopTts();
  if (!window.speechSynthesis) { playWebAudio(t); return; }
  var voices = speechSynthesis.getVoices();
  var deVoice = null;
  for (var i = 0; i < voices.length; i++) {
    if (voices[i].lang && voices[i].lang.toLowerCase().indexOf('de') !== -1) { deVoice = voices[i]; break; }
  }
  var count = 0;
  function speakOnce() {
    if (count >= 2) return;
    var u = new SpeechSynthesisUtterance(t);
    u.lang = 'de-DE';
    if (deVoice) u.voice = deVoice;
    u.volume = 1.0;
    u.rate = (count === 1) ? 0.68 : 1.0;
    window._utts.push(u);
    u.onend = function() { count++; if (count < 2) ttsTimer = setTimeout(speakOnce, 450); };
    u.onerror = function(e) { if (e.error !== 'interrupted' && e.error !== 'canceled') playWebAudio(t); };
    speechSynthesis.speak(u);
  }
  speakOnce();
}

function pickFromPool(pool) {
  var seen = seenMap[curLv];
  var avail = pool.filter(function(item) { return seen.indexOf(item.d) === -1; });
  if (avail.length < 3) {
    var prevTexts = set.map(function(s) { return s.d; });
    seenMap[curLv] = prevTexts.slice();
    avail = pool.filter(function(item) { return prevTexts.indexOf(item.d) === -1; });
  }
  var shuffled = avail.slice().sort(function() { return Math.random() - 0.5; });
  var res = [], usedTids = [];
  for (var i = 0; i < shuffled.length; i++) {
    if (res.length >= 3) break;
    if (usedTids.indexOf(shuffled[i].tid) === -1) {
      usedTids.push(shuffled[i].tid);
      res.push(shuffled[i]);
      seenMap[curLv].push(shuffled[i].d);
    }
  }
  set = res;
  draw();
}

function getNew() {
  if (allData && allData[curLv]) { pickFromPool(allData[curLv]); return; }
  fetch('sentences.json?v=' + Date.now())
    .then(function(r) { return r.json(); })
    .then(function(json) { allData = json; if (allData[curLv]) pickFromPool(allData[curLv]); })
    .catch(function() { draw(); });
}
function wrapWords(sentence) {
  return sentence.split(' ').map(function(w) {
    var safe = w.replace(/'/g, "\\'").replace(/"/g, '&quot;');
    return '<span class="dw" onclick="showWordTip(this, \'' + safe + '\')">' + w + '</span>';
  }).join(' ');
}

function toggleKo(i) {
  var el = document.getElementById('ko' + i);
  var btn = document.getElementById('eye' + i);
  var isHidden = el.classList.toggle('hide');
  btn.innerText = isHidden ? '▾' : '▴';
}

function draw() {
  hideTip(); stopTts(); stopMic();
  var html = "";
  for (var i = 0; i < set.length; i++) {
    var x = set[i];
    html += '<div class="card">' +
      '<div class="row1"><span class="de">' + wrapWords(x.d) + '</span><div style="display:flex;"><button class="ibtn" onclick="tts(set[' + i + '].d)">🔊</button><button class="ibtn" onclick="mic(' + i + ')">🎙️</button></div></div>' +
      '<div class="row2"><span class="ko hide" id="ko' + i + '" onclick="toggleKo(' + i + ')">' + x.k + '</span><button class="minibtn" id="eye' + i + '" onclick="toggleKo(' + i + ')">▾</button></div>' +
      '<div id="fb' + i + '" style="font-size:0.84rem; margin-top:6px; font-weight:600;"></div>' +
    '</div>';
  }
  document.getElementById('v1').innerHTML = html;
  if (document.getElementById('v2').style.display === 'block') initQ();
}

function mode(m) {
  hideTip(); stopTts(); stopMic();
  document.getElementById('t1').className = m === 1 ? 'tab on' : 'tab';
  document.getElementById('t2').className = m === 2 ? 'tab on' : 'tab';
  document.getElementById('v1').style.display = m === 1 ? 'block' : 'none';
  document.getElementById('v2').style.display = m === 2 ? 'block' : 'none';
  if (m === 2) initQ();
}

function norm(s) { return String(s).toLowerCase().replace(/[?!.,]/g,'').replace(/\s+/g,' ').trim().replace(/ä/g,'a').replace(/ö/g,'o').replace(/ü/g,'u').replace(/ß/g,'ss'); }
function plus() { thumbs++; try{localStorage.setItem('g_th',thumbs);}catch(e){} document.getElementById('tCnt').innerText = thumbs; if(thumbs%3===0) setTimeout(dog,400); }

function playCuteSound() {
  try {
    var AudioCtx = window.AudioContext || window.webkitAudioContext;
    if (!AudioCtx) return;
    var ctx = new AudioCtx();
    var notes = [523.25, 659.25, 783.99, 1046.50];
    var now = ctx.currentTime;
    for (var i = 0; i < notes.length; i++) {
      var osc = ctx.createOscillator(), gain = ctx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(notes[i], now + i * 0.07);
      gain.gain.setValueAtTime(0.08, now + i * 0.07);
      gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.07 + 0.18);
      osc.connect(gain); gain.connect(ctx.destination);
      osc.start(now + i * 0.07); osc.stop(now + i * 0.07 + 0.19);
    }
  } catch(e) {}
}

function dog() {
  hideTip(); stopTts(); stopMic();
  document.getElementById('dTit').innerText = "🎉 현재 따봉 " + thumbs + "개!";
  document.getElementById('dogM').style.display = 'flex';
  playCuteSound();
}

function getSR() {
  var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) return null;
  if (!sharedSR) { sharedSR = new SR(); sharedSR.lang = 'de-DE'; sharedSR.interimResults = false; }
  return sharedSR;
}

function mic(i) {
  hideTip(); stopTts(); stopMic();
  var r = getSR(), fb = document.getElementById('fb'+i);
  if (!r) { fb.innerText='⚠️ 크롬을 써주세요.'; return; }
  isListening = true;
  fb.style.color='#4f46e5'; fb.innerText='🎙️ 듣는 중... 다 말씀하시면 자동 확인됩니다.';
  r.onresult = function(e) {
    if (!isListening) return; isListening = false;
    var s = e.results.item(0).item(0).transcript;
    if (norm(s) === norm(set[i].d)) { fb.style.color='#10b981'; fb.innerText='👍 정답! ("'+s+'") +1 따봉!'; plus(); }
    else { fb.style.color='#d97706'; fb.innerText='💬 인식됨: "'+s+'" (다시 시도해보세요)'; }
  };
  r.onerror = function(e) { if (!isListening) return; isListening = false; fb.style.color='#ef4444'; fb.innerText='⚠️ 오류: '+e.error; };
  setTimeout(function(){ if(isListening) { try { r.start(); } catch(e){} } }, 120);
}
function initQ() {
  qL = set.slice().sort(function(){ return Math.random()-0.5; }); qi = 0;
  document.getElementById('inp').style.display='block';
  document.getElementById('qMic').style.display='block';
  document.querySelector('.ubar').style.display='flex';
  showQ();
}

function showQ() {
  stopTts(); stopMic(); done = false;
  document.getElementById('rMsg').innerHTML = '';
  document.getElementById('cBtn').innerText = '정답 확인';
  document.getElementById('cBtn').style.background = '#10b981';
  var inp = document.getElementById('inp'); inp.value = ''; inp.disabled = false;
  document.getElementById('qStep').innerText = '[' + curLv + '] 문제 ' + (qi + 1) + ' / 3';
  document.getElementById('qTxt').innerText = '🇰🇷 "' + qL[qi].k + '"';
}

function ins(c) { var inp=document.getElementById('inp'); if(!inp.disabled){inp.value+=c; inp.focus();} }

function micQ() {
  if (done || qi === -1) return;
  stopTts(); stopMic();
  var r = getSR(); if (!r) return;
  isListening = true;
  var mBtn = document.getElementById('qMic'), rMsg = document.getElementById('rMsg');
  mBtn.innerText = '🎙️ 듣는 중... (말씀하세요)';
  rMsg.style.color = '#4f46e5'; rMsg.innerText = '말씀이 끝나면 자동으로 입력됩니다.';
  r.onresult = function(e) {
    if (!isListening) return; isListening = false;
    document.getElementById('inp').value = e.results.item(0).item(0).transcript;
    mBtn.innerText = '🎙️ 말하기로 풀기'; rMsg.innerText = ''; chk();
  };
  r.onerror = function() {
    if (!isListening) return; isListening = false;
    mBtn.innerText = '🎙️ 말하기로 풀기'; rMsg.style.color = '#ef4444'; rMsg.innerText = '음성이 인식되지 않았습니다.';
  };
  setTimeout(function(){ if(isListening) { try { r.start(); } catch(e){} } }, 120);
}

function retryQ() { showQ(); }

function chk() {
  stopMic();
  if (qi === -1) { initQ(); return; }
  if (done) {
    qi++;
    if (qi < 3) { showQ(); }
    else {
      document.getElementById('qTxt').innerText = '🎉 [' + curLv + '] 테스트 완료!';
      document.getElementById('inp').style.display = 'none';
      document.getElementById('qMic').style.display = 'none';
      document.querySelector('.ubar').style.display = 'none';
      document.getElementById('rMsg').style.color = '#18181b';
      document.getElementById('rMsg').innerText = '현재 따봉: 👍 ' + thumbs + '개!';
      document.getElementById('cBtn').innerText = '다시 풀기';
      qi = -1;
    }
    return;
  }
  var inp = document.getElementById('inp');
  if (!inp.value.trim()) return;
  var m = document.getElementById('rMsg');
  if (norm(inp.value) === norm(qL[qi].d)) {
    m.style.color = '#10b981'; m.innerHTML = '⭕ 정답입니다! (' + qL[qi].d + ')'; plus();
  } else {
    m.style.color = '#ef4444';
    m.innerHTML = '❌ 틀렸습니다! 정답: <b>' + qL[qi].d + '</b><br>' +
      '<button onclick="retryQ()" style="margin-top:10px; padding:8px 16px; border:1px solid #e2e8f0; border-radius:10px; background:#f8fafc; font-weight:700; cursor:pointer; color:#18181b;">🔄 다시 시도하기</button>';
  }
  inp.disabled = true; done = true;
  document.getElementById('cBtn').innerText = qi < 2 ? '다음 문제 ▶' : '결과 보기';
  document.getElementById('cBtn').style.background = '#4f46e5';
}

draw(); getNew();
</script>
