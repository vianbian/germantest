  .ubar { display: flex; gap: 8px; margin-bottom: 12px; }

<script>
var curLv = 'A1';
var seenMap = { A1: [], A2: [], B1: [], B2: [] };
var set = [
  {d:"Was machst du?", k:"너 뭐 해?"},
  {d:"Ich mache Kaffee.", k:"나 커피 만들고 있어."},
  {d:"Das macht wirklich Spaß!", k:"그거 진짜 재미있다!"}
];
var thumbs = 0, qL = [], qi = 0, done = false, sharedSR = null, ttsTimer = null, isListening = false;
var curAud = new Audio();
window._utts = [];

try { thumbs = parseInt(localStorage.getItem('g_th') || '0', 10); document.getElementById('tCnt').innerText = thumbs; } catch(e){}
if (window.speechSynthesis) { try { speechSynthesis.getVoices(); } catch(e){} }

function setLv(lv) {
  curLv = lv;
  var lvs = ['A1', 'A2', 'B1', 'B2'];
  for (var i = 0; i < lvs.length; i++) {
    document.getElementById('lv' + lvs[i]).className = (lvs[i] === lv) ? 'lvbtn on' : 'lvbtn';
  }
  getNew();
}

function stopMic() {
  isListening = false;
  if (sharedSR) {
    sharedSR.onresult = null;
    sharedSR.onerror = null;
    try { sharedSR.abort(); } catch(e){}
  }
  var qMicBtn = document.getElementById('qMic');
  if (qMicBtn) qMicBtn.innerText = '🎙️ 말하기로 풀기';
  for (var i = 0; i < 3; i++) {
    var fb = document.getElementById('fb' + i);
    if (fb && fb.innerText.indexOf('듣는 중') !== -1) fb.innerText = '';
  }
}

function stopTts() {
  if (ttsTimer) { clearTimeout(ttsTimer); ttsTimer = null; }
  if (window.speechSynthesis) { try { speechSynthesis.cancel(); } catch(e){} }
  try { curAud.pause(); curAud.onended = null; curAud.onerror = null; } catch(e){}
}

function playWebAudio(t) {
  var count = 0;
  function nextPlay() {
    if (count >= 2) return;
    curAud.src = "https://streamelements.com" + encodeURIComponent(t);
    curAud.playbackRate = (count === 1) ? 0.72 : 1.0;
    curAud.onended = function() {
      count++;
      if (count < 2) ttsTimer = setTimeout(nextPlay, 450);
    };
    curAud.play().catch(function(){});
  }
  nextPlay();
}

function tts(t) {
  stopMic();
  stopTts();

  if (!window.speechSynthesis) {
    playWebAudio(t);
    return;
  }

  var voices = speechSynthesis.getVoices();
  var deVoice = null;
  for (var i = 0; i < voices.length; i++) {
    if (voices[i].lang && voices[i].lang.toLowerCase().indexOf('de') !== -1) {
      deVoice = voices[i];
      break;
    }
  }

  var count = 0;
  function speakOnce() {
    if (count >= 2) return;
    var u = new SpeechSynthesisUtterance(t);
    u.lang = 'de-DE';
    if (deVoice) u.voice = deVoice;
    u.volume = 1.0;
    u.rate = (count === 1) ? 0.68 : 1.0;
    window._utts.push(u);

    u.onend = function() {
      count++;
      if (count < 2) ttsTimer = setTimeout(speakOnce, 450);
    };
    u.onerror = function(e) {
      if (e.error !== 'interrupted' && e.error !== 'canceled') {
        playWebAudio(t);
      }
    };
    speechSynthesis.speak(u);
  }
  speakOnce();
}
function getPool(lv) {
  if (lv === 'A1') {
    return [
      {d:"Ich trinke morgens gern einen Kaffee.", k:"나는 아침에 커피 마시는 것을 좋아해요.", tid:"a1_1"},
      {d:"Wir kaufen heute frisches Brot und Obst.", k:"우리는 오늘 신선한 빵과 과일을 사요.", tid:"a1_2"},
      {d:"Entschuldigung, wo ist hier der Bahnhof?", k:"실례합니다, 여기 기차역이 어디에 있나요?", tid:"a1_3"},
      {d:"Kannst du mir bitte kurz helfen?", k:"나 좀 잠깐 도와줄 수 있어?", tid:"a1_4"},
      {d:"Was kostet das alles zusammen?", k:"이거 전부 다 해서 얼마인가요?", tid:"a1_5"},
      {d:"Kann ich hier auch mit Karte zahlen?", k:"여기서 카드로도 계산할 수 있나요?", tid:"a1_6"},
      {d:"Wie spät ist es jetzt genau?", k:"지금 정확히 몇 시인가요?", tid:"a1_7"},
      {d:"Ich möchte gern ein Glas Wasser bestellen.", k:"물 한 잔 주문하고 싶어요.", tid:"a1_8"},
      {d:"Die Rechnung, bitte. Es hat sehr gut geschmeckt.", k:"계산서 주세요. 정말 맛있었어요.", tid:"a1_9"},
      {d:"Ich verstehe das leider nicht.", k:"아쉽게도 그건 이해가 안 돼요.", tid:"a1_10"},
      {d:"Ich bin heute nach der Arbeit sehr müde.", k:"나 오늘 퇴근하고 나서 너무 피곤해.", tid:"a1_11"},
      {d:"Woher kommst du und wo wohnst du jetzt?", k:"너는 어디서 왔고 지금 어디에 사니?", tid:"a1_12"},
      {d:"Mein Zug fährt um acht Uhr ab.", k:"제 기차는 8시에 출발합니다.", tid:"a1_13"},
      {d:"Hast du heute Abend schon etwas vor?", k:"오늘 저녁에 벌써 무슨 계획 있어?", tid:"a1_14"},
      {d:"Ich suche die Toilette. Ist sie links?", k:"화장실을 찾고 있어요. 왼쪽에 있나요?", tid:"a1_15"},
      {d:"Am Samstag gehe ich mit Freunden ins Kino.", k:"토요일에 나는 친구들과 영화관에 가요.", tid:"a1_16"},
      {d:"Das Wetter ist heute wirklich wunderbar!", k:"오늘 날씨가 정말 끝내주게 좋네요!", tid:"a1_17"},
      {d:"Wie ist Ihre Telefonnummer, bitte?", k:"전화번호가 어떻게 되시나요?", tid:"a1_18"},
      {d:"Ich habe leider keine Zeit für einen Spaziergang.", k:"아쉽게도 산책할 시간이 없어요.", tid:"a1_19"},
      {d:"Guten Appetit! Das Essen sieht lecker aus.", k:"맛있게 드세요! 음식이 맛있어 보이네요.", tid:"a1_20"}
    ];
  }
  if (lv === 'A2') {
    return [

```javascript
function toggleKo(i) {
  var el = document.getElementById('ko' + i);
  var btn = document.getElementById('eye' + i);
  var isHidden = el.classList.toggle('hide');
  btn.innerText = isHidden ? '▾' : '▴';
}

function draw() {
  stopTts();
  stopMic();
  var html = "";
  for (var i = 0; i < set.length; i++) {
    var x = set[i];
    html += '<div class="card">' +
      '<div class="row1"><span class="de">' + x.d + '</span><div style="display:flex;"><button class="ibtn" onclick="tts(set[' + i + '].d)">🔊</button><button class="ibtn" onclick="mic(' + i + ')">🎙️</button></div></div>' +
      '<div class="row2"><span class="ko hide" id="ko' + i + '" onclick="toggleKo(' + i + ')">' + x.k + '</span><button class="minibtn" id="eye' + i + '" onclick="toggleKo(' + i + ')">▾</button></div>' +
      '<div id="fb' + i + '" style="font-size:0.84rem; margin-top:6px; font-weight:600;"></div>' +
    '</div>';
  }
  document.getElementById('v1').innerHTML = html;
  if (document.getElementById('v2').style.display === 'block') initQ();
}

function getNew() {
  var pool = getPool(curLv);
  var seen = seenMap[curLv];

  // 최근에 보지 않은 문장만 먼저 필터링
  var avail = pool.filter(function(item) {
    return seen.indexOf(item.d) === -1;
  });

  // 남은 문장이 3개 미만이면 기록을 초기화하고 새 사이클 시작 (직전 3문장은 제외)
  if (avail.length < 3) {
    var prevTexts = set.map(function(s) { return s.d; });
    seenMap[curLv] = prevTexts.slice();
    avail = pool.filter(function(item) {
      return prevTexts.indexOf(item.d) === -1;
    });
  }

  // 무작위 셔플 후 서로 다른 패턴(tid) 3개 선택
  var shuffled = avail.slice().sort(function() { return Math.random() - 0.5; });
  var res = [];
  var usedTids = [];

  for (var i = 0; i < shuffled.length; i++) {
    if (res.length >= 3) break;
    if (usedTids.indexOf(shuffled[i].tid) === -1) {
      usedTids.push(shuffled[i].tid);
      res.push(shuffled[i]);
      seenMap[curLv].push(shuffled[i].d);
    }
  }

  set = res;
  draw();
}

function mode(m) {
  stopTts();
  stopMic();
  document.getElementById('t1').className = m === 1 ? 'tab on' : 'tab';
  document.getElementById('t2').className = m === 2 ? 'tab on' : 'tab';
  document.getElementById('v1').style.display = m === 1 ? 'block' : 'none';
  document.getElementById('v2').style.display = m === 2 ? 'block' : 'none';
  if (m === 2) initQ();
}
function norm(s) { return String(s).toLowerCase().replace(/[?!.,]/g,'').replace(/\s+/g,' ').trim().replace(/ä/g,'a').replace(/ö/g,'o').replace(/ü/g,'u').replace(/ß/g,'ss'); }
function plus() { thumbs++; try{localStorage.setItem('g_th',thumbs);}catch(e){} document.getElementById('tCnt').innerText = thumbs; if(thumbs%3===0) setTimeout(dog,400); }

function playCuteSound() {
  try {
    var AudioCtx = window.AudioContext || window.webkitAudioContext;
    if (!AudioCtx) return;
    var ctx = new AudioCtx();
    var notes = [523.25, 659.25, 783.99, 1046.50];
    var now = ctx.currentTime;
    for (var i = 0; i < notes.length; i++) {
      var osc = ctx.createOscillator();
      var gain = ctx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(notes[i], now + i * 0.07);
      gain.gain.setValueAtTime(0.08, now + i * 0.07);
      gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.07 + 0.18);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start(now + i * 0.07);
      osc.stop(now + i * 0.07 + 0.19);
    }
  } catch(e) {}
}

function dog() {
  stopTts();
  stopMic();
  document.getElementById('dTit').innerText = "🎉 현재 따봉 " + thumbs + "개!";
  document.getElementById('dogM').style.display = 'flex';
  playCuteSound();
}

function getSR() {
  var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) return null;
  if (!sharedSR) { sharedSR = new SR(); sharedSR.lang = 'de-DE'; sharedSR.interimResults = false; }
  return sharedSR;
}

function mic(i) {
  stopTts();
  stopMic();
  var r = getSR(), fb = document.getElementById('fb'+i);
  if (!r) { fb.innerText='⚠️ 크롬을 써주세요.'; return; }
  isListening = true;
  fb.style.color='#4f46e5'; fb.innerText='🎙️ 듣는 중... 다 말씀하시면 자동 확인됩니다.';
  r.onresult = function(e) {
    if (!isListening) return;
    isListening = false;
    var s = e.results.item(0).item(0).transcript;
    if (norm(s) === norm(set[i].d)) { fb.style.color='#10b981'; fb.innerText='👍 정답! ("'+s+'") +1 따봉!'; plus(); }
    else { fb.style.color='#d97706'; fb.innerText='💬 인식됨: "'+s+'" (다시 시도해보세요)'; }
  };
  r.onerror = function(e) {
    if (!isListening) return;
    isListening = false;
    fb.style.color='#ef4444'; fb.innerText='⚠️ 오류: '+e.error;
  };
  setTimeout(function(){ if(isListening) { try { r.start(); } catch(e){} } }, 120);
}

function initQ() {
  qL = set.slice().sort(function(){ return Math.random()-0.5; }); qi = 0;
  document.getElementById('inp').style.display='block';
  document.getElementById('qMic').style.display='block';
  document.querySelector('.ubar').style.display='flex';
  showQ();
}

function showQ() {
  stopTts();
  stopMic();
  done = false;
  document.getElementById('rMsg').innerHTML = '';
  document.getElementById('cBtn').innerText = '정답 확인';
  document.getElementById('cBtn').style.background = '#10b981';
  var inp = document.getElementById('inp');
  inp.value = '';
  inp.disabled = false;
  document.getElementById('qStep').innerText = '[' + curLv + '] 문제 ' + (qi + 1) + ' / 3';
  document.getElementById('qTxt').innerText = '🇰🇷 "' + qL[qi].k + '"';
}

function ins(c) { var inp=document.getElementById('inp'); if(!inp.disabled){inp.value+=c; inp.focus();} }

function micQ() {
  if (done || qi === -1) return;
  stopTts();
  stopMic();
  var r = getSR(); if (!r) return;
  isListening = true;
  var mBtn = document.getElementById('qMic');
  var rMsg = document.getElementById('rMsg');
  mBtn.innerText = '🎙️ 듣는 중... (말씀하세요)';
  rMsg.style.color = '#4f46e5';
  rMsg.innerText = '말씀이 끝나면 자동으로 입력됩니다.';

  r.onresult = function(e) {
    if (!isListening) return;
    isListening = false;
    var spoken = e.results.item(0).item(0).transcript;
    document.getElementById('inp').value = spoken;
    mBtn.innerText = '🎙️ 말하기로 풀기';
    rMsg.innerText = '';
    chk();
  };
  r.onerror = function() {
    if (!isListening) return;
    isListening = false;
    mBtn.innerText = '🎙️ 말하기로 풀기';
    rMsg.style.color = '#ef4444';
    rMsg.innerText = '음성이 인식되지 않았습니다. 다시 눌러주세요.';
  };
  setTimeout(function(){ if(isListening) { try { r.start(); } catch(e){} } }, 120);
}

function retryQ() { showQ(); }

function chk() {
  stopMic();
  if (qi === -1) { initQ(); return; }
  if (done) {
    qi++;
    if (qi < 3) { showQ(); }
    else {
      document.getElementById('qTxt').innerText = '🎉 [' + curLv + '] 테스트 완료!';
      document.getElementById('inp').style.display = 'none';
      document.getElementById('qMic').style.display = 'none';
      document.querySelector('.ubar').style.display = 'none';
      document.getElementById('rMsg').style.color = '#18181b';
      document.getElementById('rMsg').innerText = '현재 따봉: 👍 ' + thumbs + '개!';
      document.getElementById('cBtn').innerText = '다시 풀기';
      qi = -1;
    }
    return;
  }

  var inp = document.getElementById('inp');
  if (!inp.value.trim()) return;
  var m = document.getElementById('rMsg');

  if (norm(inp.value) === norm(qL[qi].d)) {
    m.style.color = '#10b981';
    m.innerHTML = '⭕ 정답입니다! (' + qL[qi].d + ')';
    plus();
  } else {
    m.style.color = '#ef4444';
    m.innerHTML = '❌ 틀렸습니다! 정답: <b>' + qL[qi].d + '</b><br>' +
      '<button onclick="retryQ()" style="margin-top:10px; padding:8px 16px; border:1px solid #e2e8f0; border-radius:10px; background:#f8fafc; font-weight:700; cursor:pointer; color:#18181b;">🔄 다시 시도하기</button>';
  }

  inp.disabled = true;
  done = true;
  document.getElementById('cBtn').innerText = qi < 2 ? '다음 문제 ▶' : '결과 보기';
  document.getElementById('cBtn').style.background = '#4f46e5';
}
